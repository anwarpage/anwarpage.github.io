<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" width="1080" height="340" fill="none">
	<defs>
		<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
			<path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
		</marker>
		<marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
			<path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
		</marker>
	</defs>

	<!-- Pure White Background -->
	<rect width="1080" height="340" fill="#ffffff" />

	<!-- Step 1: ESP32-CAM Stream (Pill) -->
	<rect x="24" y="96" width="168" height="68" rx="34" fill="#f8fafc" stroke="#334155" stroke-width="1.75" />
	<text x="108" y="125" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">ESP32-CAM Stream</text>
	<text x="108" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">HTTP MJPEG :81/stream</text>

	<!-- Arrow 1 -> 2 -->
	<line x1="192" y1="130" x2="232" y2="130" stroke="#334155" stroke-width="1.75" marker-end="url(#arr)" />

	<!-- Step 2: MediaPipe Pose & Kinematics -->
	<rect x="240" y="88" width="204" height="84" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.75" />
	<text x="342" y="116" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">MediaPipe Pose Tracking</text>
	<text x="342" y="135" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">H/W Ratio + Hip dy &amp; ay</text>
	<text x="342" y="153" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#94a3b8">15-Frame Ring Buffer</text>

	<!-- Arrow 2 -> 3 -->
	<line x1="444" y1="130" x2="484" y2="130" stroke="#334155" stroke-width="1.75" marker-end="url(#arr)" />

	<!-- Step 3: 4-Criteria Heuristic & Temporal Gate -->
	<rect x="492" y="88" width="212" height="84" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.75" />
	<text x="598" y="116" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Kinematic Fall Filter</text>
	<text x="598" y="135" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">&gt;= 3/4 Criteria Matched</text>
	<text x="598" y="153" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#94a3b8">3 Consecutive Frames</text>

	<!-- Loopback if Normal (< 3 frames) -->
	<path d="M 598 172 L 598 256 L 342 256 L 342 180" fill="none" stroke="#334155" stroke-width="1.75" marker-end="url(#arr)" />
	<text x="470" y="246" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">Normal Posture (Next Frame)</text>

	<!-- Arrow 3 -> 4 (Fall Confirmed) -->
	<line x1="704" y1="130" x2="768" y2="130" stroke="#dc2626" stroke-width="1.75" marker-end="url(#arr-red)" />
	<text x="736" y="118" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#dc2626">Fall!</text>

	<!-- Step 4: 2x3 Sequence Grid & Async Telegram -->
	<rect x="776" y="88" width="280" height="84" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.75" />
	<text x="916" y="116" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">2x3 Sequence &amp; Telegram Bot</text>
	<text x="916" y="135" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#b91c1c">Stitch 6 Frames (save_fall_image)</text>
	<text x="916" y="153" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#dc2626">Async aiohttp /sendPhoto Alert</text>
</svg>
