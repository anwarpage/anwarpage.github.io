<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" width="1080" height="340" fill="none">
	<defs>
		<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
			<path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
		</marker>
		<marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
			<path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
		</marker>
	</defs>

	<!-- Pure White Background -->
	<rect width="1080" height="340" fill="#ffffff" />

	<!-- Node 1: Init (Pill) -->
	<rect x="32" y="86" width="144" height="56" rx="28" fill="#f8fafc" stroke="#334155" stroke-width="1.75" />
	<text x="104" y="111" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Init State</text>
	<text x="104" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">drawborder()</text>

	<!-- Arrow 1 -> 2 -->
	<line x1="176" y1="114" x2="218" y2="114" stroke="#334155" stroke-width="1.75" marker-end="url(#arr)" />

	<!-- Node 2: Input Poll -->
	<rect x="226" y="82" width="164" height="64" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.75" />
	<text x="308" y="110" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Poll Input</text>
	<text x="308" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">kbhit() / getch()</text>

	<!-- Arrow 2 -> 3 -->
	<line x1="390" y1="114" x2="432" y2="114" stroke="#334155" stroke-width="1.75" marker-end="url(#arr)" />

	<!-- Node 3: Draw Sprites -->
	<rect x="440" y="82" width="176" height="64" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.75" />
	<text x="528" y="110" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Draw Bird &amp; Pipes</text>
	<text x="528" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">gotoxy(x, y)</text>

	<!-- Arrow 3 -> 4 -->
	<line x1="616" y1="114" x2="658" y2="114" stroke="#334155" stroke-width="1.75" marker-end="url(#arr)" />

	<!-- Node 4: Decision Diamond (Collision?) -->
	<polygon points="746,62 826,114 746,166 666,114" fill="#ffffff" stroke="#334155" stroke-width="1.75" />
	<text x="746" y="111" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Collision?</text>
	<text x="746" y="127" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#64748b">collapse()</text>

	<!-- Arrow 4 -> Game Over (Yes) -->
	<line x1="826" y1="114" x2="894" y2="114" stroke="#dc2626" stroke-width="1.75" marker-end="url(#arr-red)" />
	<text x="858" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#dc2626">Yes</text>

	<!-- Node 5: Game Over (Pill) -->
	<rect x="902" y="86" width="146" height="56" rx="28" fill="#fef2f2" stroke="#dc2626" stroke-width="1.75" />
	<text x="975" y="111" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">Game Over</text>
	<text x="975" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#dc2626">gameover()</text>

	<!-- Arrow 4 -> 6 (No - Downward) -->
	<line x1="746" y1="166" x2="746" y2="218" stroke="#334155" stroke-width="1.75" marker-end="url(#arr)" />
	<text x="764" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#475569">No</text>

	<!-- Node 6: Sleep & Erase Old Position -->
	<rect x="650" y="226" width="192" height="64" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.75" />
	<text x="746" y="254" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Delay &amp; Clear Cells</text>
	<text x="746" y="272" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">Sleep(100) · erase()</text>

	<!-- Arrow 6 -> 7 (Leftward) -->
	<line x1="650" y1="258" x2="582" y2="258" stroke="#334155" stroke-width="1.75" marker-end="url(#arr)" />

	<!-- Node 7: Update Gravity & Pipe Queue -->
	<rect x="382" y="226" width="192" height="64" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.75" />
	<text x="478" y="254" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Step Gravity &amp; Pipes</text>
	<text x="478" y="272" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">birdpos++ · pipepos+=2</text>

	<!-- Loopback Arrow 7 -> 2 -->
	<path d="M 382 258 L 308 258 L 308 154" fill="none" stroke="#334155" stroke-width="1.75" marker-end="url(#arr)" />
	<text x="345" y="248" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#64748b">next tick</text>
</svg>
