<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" width="1080" height="340" fill="none">
	<defs>
		<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
			<path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
		</marker>
		<marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
			<path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
		</marker>
	</defs>

	<!-- Pure White Background -->
	<rect width="1080" height="340" fill="#ffffff" />

	<!-- Node 1: Main Menu & Login Input (Pill) -->
	<rect x="28" y="86" width="152" height="56" rx="28" fill="#f8fafc" stroke="#334155" stroke-width="1.75" />
	<text x="104" y="111" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Login Input</text>
	<text x="104" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">kartu &amp; kode_akses</text>

	<!-- Arrow 1 -> 2 -->
	<line x1="180" y1="114" x2="222" y2="114" stroke="#334155" stroke-width="1.75" marker-end="url(#arr)" />

	<!-- Node 2: Sequential Search -->
	<rect x="230" y="82" width="180" height="64" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.75" />
	<text x="320" y="110" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Sequential Search</text>
	<text x="320" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">scan akses[4][4]</text>

	<!-- Arrow 2 -> 3 -->
	<line x1="410" y1="114" x2="452" y2="114" stroke="#334155" stroke-width="1.75" marker-end="url(#arr)" />

	<!-- Node 3: Decision Diamond (Matched?) -->
	<polygon points="536,62 612,114 536,166 460,114" fill="#ffffff" stroke="#334155" stroke-width="1.75" />
	<text x="536" y="111" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Found?</text>
	<text x="536" y="127" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#64748b">ditemukan</text>

	<!-- Arrow 3 -> Reject / Retry Login (No - Downward) -->
	<path d="M 536 166 L 536 258 L 104 258 L 104 150" fill="none" stroke="#dc2626" stroke-width="1.75" marker-end="url(#arr-red)" />
	<text x="320" y="248" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#dc2626">No (ulangi_login == "y")</text>

	<!-- Arrow 3 -> 4 (Yes - Rightward) -->
	<line x1="612" y1="114" x2="664" y2="114" stroke="#334155" stroke-width="1.75" marker-end="url(#arr)" />
	<text x="636" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#16a34a">Yes</text>

	<!-- Node 4: Transaction Menu -->
	<rect x="672" y="82" width="176" height="64" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.75" />
	<text x="760" y="110" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Transaction Menu</text>
	<text x="760" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">switch(login_menu)</text>

	<!-- Arrow 4 -> 5 -->
	<line x1="848" y1="114" x2="884" y2="114" stroke="#334155" stroke-width="1.75" marker-end="url(#arr)" />

	<!-- Node 5: Update State & Log -->
	<rect x="892" y="82" width="160" height="64" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.75" />
	<text x="972" y="110" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Update &amp; Log</text>
	<text x="972" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">saldo &amp; mutasi[]</text>

	<!-- Loopback Arrow 5 -> 4 (ulangi_transaksi == "y") -->
	<path d="M 972 146 L 972 258 L 760 258 L 760 154" fill="none" stroke="#334155" stroke-width="1.75" marker-end="url(#arr)" />
	<text x="866" y="248" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">ulangi_transaksi == "y"</text>
</svg>
