			<path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
		</marker>
	</defs>

	<rect width="960" height="200" fill="#ffffff" />

	<!-- Step 1 -->
	<rect x="24" y="64" width="184" height="72" rx="36" fill="#f8fafc" stroke="#334155" stroke-width="1.75" />
	<text x="116" y="96" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">1. Dataset</text>
	<text x="116" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">868k Kaggle URLs</text>

	<line x1="208" y1="100" x2="254" y2="100" stroke="#334155" stroke-width="1.75" marker-end="url(#arr)" />

	<!-- Step 2 -->
	<rect x="262" y="64" width="192" height="72" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.75" />
