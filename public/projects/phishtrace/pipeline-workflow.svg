	<text x="358" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">TF-IDF + 30 Lexical</text>

	<line x1="454" y1="100" x2="500" y2="100" stroke="#334155" stroke-width="1.75" marker-end="url(#arr)" />

	<!-- Step 3 -->
	<rect x="508" y="64" width="192" height="72" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.75" />
