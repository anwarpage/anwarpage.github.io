	<text x="604" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">model.pkl · 1.79 MB</text>

	<line x1="700" y1="100" x2="746" y2="100" stroke="#334155" stroke-width="1.75" marker-end="url(#arr)" />

