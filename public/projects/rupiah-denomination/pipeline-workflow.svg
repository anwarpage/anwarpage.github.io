<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" width="1080" height="300" fill="none">
	<defs>
		<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
			<path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
		</marker>
	</defs>

	<!-- Pure White Background -->
	<rect width="1080" height="300" fill="#ffffff" />

	<!-- Step 1: Curated Dataset & Video Input (Pill) -->
	<rect x="24" y="108" width="212" height="84" rx="42" fill="#f8fafc" stroke="#334155" stroke-width="1.75" />
	<text x="130" y="138" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">1. Dataset &amp; Frame Input</text>
	<text x="130" y="157" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">2,877 Manual Photos (7 Class)</text>
	<text x="130" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#94a3b8">cv2.VideoCapture(frame)</text>

	<!-- Arrow 1 -> 2 -->
	<line x1="236" y1="150" x2="276" y2="150" stroke="#334155" stroke-width="1.75" marker-end="url(#arr)" />

	<!-- Step 2: YOLOv8n Detection & Confidence Gate -->
	<rect x="284" y="108" width="224" height="84" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.75" />
	<text x="396" y="138" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">2. YOLOv8n Inference</text>
	<text x="396" y="157" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">results.boxes.data.tolist()</text>
	<text x="396" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#94a3b8">Filter: score &gt; 0.80</text>

	<!-- Arrow 2 -> 3 -->
	<line x1="508" y1="150" x2="548" y2="150" stroke="#334155" stroke-width="1.75" marker-end="url(#arr)" />

	<!-- Step 3: Nominal String Slicing & Frame Summation -->
	<rect x="556" y="108" width="228" height="84" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.75" />
	<text x="670" y="138" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">3. Denomination Sum</text>
	<text x="670" y="157" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">int(class_name[2:])</text>
	<text x="670" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#94a3b8">total_frame_money += nominal</text>

	<!-- Arrow 3 -> 4 -->
	<line x1="784" y1="150" x2="824" y2="150" stroke="#334155" stroke-width="1.75" marker-end="url(#arr)" />

	<!-- Step 4: Locale Currency Formatting & OpenCV Overlay -->
	<rect x="832" y="108" width="224" height="84" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.75" />
	<text x="944" y="138" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#15803d">4. Rupiah Overlay Output</text>
	<text x="944" y="157" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#16a34a">locale.currency(id_ID)</text>
	<text x="944" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#15803d">BBox + Total Rp HUD</text>
</svg>
