<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" width="1080" height="300" fill="none">
	<defs>
		<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
			<path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
		</marker>
	</defs>

	<rect width="1080" height="300" fill="#ffffff" />

	<!-- Step 1: Register with NIK (Pill) -->
	<rect x="24" y="96" width="212" height="84" rx="42" fill="#f8fafc" stroke="#334155" stroke-width="1.75" />
	<text x="130" y="126" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">1. Register with NIK</text>
	<text x="130" y="145" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">16 digits = account ID</text>
	<text x="130" y="162" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#94a3b8">one NIK, one account</text>

	<line x1="236" y1="138" x2="276" y2="138" stroke="#334155" stroke-width="1.75" marker-end="url(#arr)" />

	<!-- Step 2: Browse policies -->
	<rect x="284" y="96" width="224" height="84" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.75" />
	<text x="396" y="126" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">2. Browse Policies</text>
	<text x="396" y="145" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">category · Trending sort</text>
	<text x="396" y="162" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#94a3b8">votes + comments in parallel</text>

	<line x1="508" y1="138" x2="548" y2="138" stroke="#334155" stroke-width="1.75" marker-end="url(#arr)" />

	<!-- Step 3: Vote once -->
	<rect x="556" y="96" width="228" height="84" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.75" />
	<text x="670" y="126" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">3. Vote &amp; Discuss</text>
	<text x="670" y="145" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">upsert (policy_id, user_id)</text>
	<text x="670" y="162" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#94a3b8">agree / disagree sentiment</text>

	<line x1="784" y1="138" x2="824" y2="138" stroke="#334155" stroke-width="1.75" marker-end="url(#arr)" />

	<!-- Step 4: Aspiration -->
	<rect x="832" y="96" width="224" height="84" rx="10" fill="#eff6ff" stroke="#1c74e9" stroke-width="1.75" />
	<text x="944" y="126" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1c5fc4">4. Send Aspiration</text>
	<text x="944" y="145" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">agency · photo evidence</text>
	<text x="944" y="162" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#94a3b8">status starts "pending"</text>

	<!-- Appwrite backbone -->
	<rect x="24" y="214" width="1032" height="44" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.25" stroke-dasharray="5 4" />
	<text x="540" y="241" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#475569">Appwrite · Account (auth) · Databases: users, policies, votes, policy_comments, aspirations · Storage (photos)</text>
</svg>
